[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+. 22 matches CI.
  NODE_VERSION = "22"

# Hashed build output never changes, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed static files (portraits, icons, social image) must be able to change.
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The page itself is revalidated on every visit so a new deploy shows up at once.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # The game needs audio output only. mailto: links are plain navigation and are unaffected.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Same-origin only: no third-party scripts, styles, fonts or connections. Inline styles are
    # used by the game UI. connect-src 'self' covers the contact form POST to this site.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# No [[redirects]] on purpose: a catch-all rule would swallow the contact form POST to "/" before
# Netlify Forms sees it (tests/seoBuild.test.ts guards this). Redirecting the *.netlify.app address
# to the custom domain is a dashboard setting or a rule with a specific host, added only once the
# exact subdomain is known.
